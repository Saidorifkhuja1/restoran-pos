name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restopos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restopos?schema=public
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      NEXTAUTH_SECRET: ci-nextauth-secret-ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:5173
      REDIS_URL: redis://localhost:6379
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @restopos/server prisma:generate
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
